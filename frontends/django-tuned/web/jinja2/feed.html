{% extends "base.html" %}
{% from "_post.html" import post_card %}
{% block content %}
<form method="post" action="?create" class="compose">{{ csrf_input }}
  <textarea name="body" maxlength="500" placeholder="What's happening on the $12 server?" required rows="3"></textarea>
  <div>
    {% if error %}<span class="error">{{ error }}</span>{% else %}<span class="muted">max 500 chars</span>{% endif %}
    <button type="submit">Post</button>
  </div>
</form>
<h1>Latest</h1>
<section class="feed">
{% for post in posts %}{{ post_card(post, True, csrf_input) }}
{% endfor %}</section>
{% endblock %}
