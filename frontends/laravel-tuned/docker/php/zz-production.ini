; Loaded after php.ini-production. OPcache keeps compiled PHP (framework, app, cached config/routes/views) in
; shared memory; validate_timestamps=0 means files are never re-checked (production: code is immutable in the image).
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Tuned: OPcache's tracing JIT (off by default in PHP 8.5). The workers run the same framework code for every
; request, so the hot paths get compiled to machine code: about -16% instructions per request here.
opcache.jit=tracing
opcache.jit_buffer_size=64M

expose_php=Off
