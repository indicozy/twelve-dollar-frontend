# nginx in front of the unmodified Next.js standalone server (127.0.0.1:3001), same container.
# Microcache: anonymous GET / for 1 s and GET /posts/<id> for 5 s. Everything else passes through uncached.
worker_processes 1;
worker_rlimit_nofile 65536;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 32768;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    # Same idle keep-alive as Node's default, so client connection reuse matches the plain Next.js variant.
    keepalive_timeout 5s;
    keepalive_requests 10000;

    proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:10m max_size=256m inactive=60s use_temp_path=off;

    # Next.js compresses itself; normalise Accept-Encoding to gzip/none so the cache key has two variants at most.
    map $http_accept_encoding $ae {
        ~*gzip  gzip;
        default "";
    }

    upstream next {
        server 127.0.0.1:3001;
        keepalive 64;
        # Below Node's 5 s keepAliveTimeout, so nginx never reuses a socket Node is about to close.
        keepalive_timeout 4s;
    }

    server {
        listen 3000 default_server reuseport backlog=4096;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding $ae;
        proxy_read_timeout 60s;

        # Cached locations. Bypass (and don't store) when any of these is non-empty:
        #   token cookie (signed-in user: page shows @username and like/compose forms),
        #   RSC / router headers and any query string (?_rsc=..., ?error=...): RSC payloads and prefetches, never HTML,
        #   Next-Action (server action) and Authorization.
        # Cache-Control (Next sends "private, no-store" for dynamic pages) and Vary are ignored on purpose: every
        # Vary dimension except Accept-Encoding is a bypass above, and Accept-Encoding is in the key.
        # Responses with Set-Cookie are never stored (nginx default).
        set $skip "";
        if ($args != "") { set $skip 1; }

        location = / {
            proxy_pass http://next;
            proxy_cache micro;
            proxy_cache_key "$request_method|$host|$uri|$ae";
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_background_update on;
            proxy_ignore_headers Cache-Control Expires Vary X-Accel-Expires X-Accel-Buffering;
            proxy_cache_bypass $cookie_token $http_rsc $http_next_router_state_tree $http_next_router_prefetch $http_next_router_segment_prefetch $http_next_action $http_authorization $skip;
            proxy_no_cache     $cookie_token $http_rsc $http_next_router_state_tree $http_next_router_prefetch $http_next_router_segment_prefetch $http_next_action $http_authorization $skip;
            add_header X-Cache $upstream_cache_status always;
        }

        location ~ ^/posts/[0-9]+$ {
            proxy_pass http://next;
            proxy_cache micro;
            proxy_cache_key "$request_method|$host|$uri|$ae";
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_background_update on;
            proxy_ignore_headers Cache-Control Expires Vary X-Accel-Expires X-Accel-Buffering;
            proxy_cache_bypass $cookie_token $http_rsc $http_next_router_state_tree $http_next_router_prefetch $http_next_router_segment_prefetch $http_next_action $http_authorization $skip;
            proxy_no_cache     $cookie_token $http_rsc $http_next_router_state_tree $http_next_router_prefetch $http_next_router_segment_prefetch $http_next_action $http_authorization $skip;
            add_header X-Cache $upstream_cache_status always;
        }

        # Everything else (POSTs incl. server actions, /api/*, /login, /_next/static/*, 404s): straight to Next.js.
        location / {
            proxy_pass http://next;
        }
    }
}
