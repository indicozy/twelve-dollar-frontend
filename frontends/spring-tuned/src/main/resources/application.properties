spring.application.name=spring

# Runtime contract shared by every variant (frontends/SPEC.md). Spring does not bind HOST/PORT on its own.
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
app.backend-url=${BACKEND_URL:http://127.0.0.1:4000}
app.jwt-secret=${JWT_SECRET:twelve-dollar-challenge}

# Everything else is the framework default: Tomcat's thread pool (platform threads, 200 max), no compression,
# Thymeleaf template cache on (it caches parsed templates, not data), no static-resource cache-control.

# spring-tuned (see README.md, "Tuning"). Compile Thymeleaf's SpEL expressions (${post.author}, th:each, ...) to
# bytecode once they are hot, instead of interpreting the expression AST on every evaluation.
spring.thymeleaf.enable-spring-el-compiler=true
# Virtual threads (spring.threads.virtual.enabled=true) were tried and left OFF: they remove the 200-thread cap, so an
# overloaded 0.4-vCPU box accepts every request at once; at 4,500 users it melted down (60 s timeouts, 53% errors)
# where the platform pool only queues.
