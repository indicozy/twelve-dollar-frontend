# The whole "frontend server" for the client-side variant: static files + a keep-alive proxy to the API box.
worker_processes 1;            # the box has 1 vCPU ("auto" would count the host's cores)
worker_rlimit_nofile 65535;
events { worker_connections 16384; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  access_log off;
  include /etc/nginx/conf.d/*.conf;
}
