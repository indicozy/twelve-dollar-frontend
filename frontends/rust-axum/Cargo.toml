[package]
name = "feed-frontend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.9"
askama = "=0.16.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["parsing"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
