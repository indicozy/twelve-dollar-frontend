{% extends "layout.html" %}
{% block content %}
<form method="post" action="/actions/create" class="compose">
<textarea name="body" maxlength="500" placeholder="What's happening on the $12 server?" required rows="3"></textarea>
<div>
{% if let Some(err) = error %}<span class="error">{{ err }}</span>{% else %}<span class="muted">max 500 chars</span>{% endif %}
<button type="submit">Post</button>
</div>
</form>
<h1>Latest</h1>
<section class="feed">
{% let link = true %}
{% for post in posts %}{% include "post_card.html" %}{% endfor %}
</section>
{% endblock %}
