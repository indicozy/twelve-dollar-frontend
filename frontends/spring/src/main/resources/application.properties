spring.application.name=spring

# Runtime contract shared by every variant (frontends/SPEC.md). Spring does not bind HOST/PORT on its own.
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
app.backend-url=${BACKEND_URL:http://127.0.0.1:4000}
app.jwt-secret=${JWT_SECRET:twelve-dollar-challenge}

# Everything else is the framework default: Tomcat's thread pool (platform threads, 200 max), no compression,
# Thymeleaf template cache on (it caches parsed templates, not data), no static-resource cache-control.
