; The only FPM config in the image (the php image's www.conf/docker.conf/zz-docker.conf are removed).
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; "10 workers", like the video: a fixed pool, no spawning under load. Each worker handles one request at a time
; (blocking on the API call), so this is also the concurrency limit; extra requests queue on the socket backlog.
; Measured idle: ~38-42 MB RSS per worker, but only ~2-5 MB private; the rest is shared (OPcache ~23 MB of shmem,
; libraries). The whole FPM side idles at ~51 MB, so 10 workers fit a 2 GB box many times over; memory_limit
; (128M, php.ini-production) caps a single request.
pm = static
pm.max_children = 10
pm.max_requests = 0

; No per-request FPM access log (the image's docker.conf logs every request to stderr).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
