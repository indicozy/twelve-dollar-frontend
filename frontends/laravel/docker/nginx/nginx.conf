# nginx in front of PHP-FPM, same container. Based on Laravel's documented nginx config
# (https://laravel.com/docs/deployment#nginx). One worker for the 1-vCPU box, gzip off, keep-alive on.
user www-data;
worker_processes 1;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    # Each load-test VU keeps a keep-alive connection open (k6 runs thousands); a request also uses one
    # connection to FPM. Node variants accept unlimited sockets, so don't let nginx's default (512/768) cap it.
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;          # the Node variants log nothing per request either
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;                # nginx's default; no variant compresses in-process except Next.js

    server {
        listen 3000;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
